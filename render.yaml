services:
  - type: web
    name: terratrust-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./fin03.db
      - key: LOG_LEVEL
        value: INFO
